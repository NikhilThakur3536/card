<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aanya &amp; Vihaan — Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;family=DM+Sans:wght@400;500&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet">
<style>
:root{--wine:#541C35;--plum:#482033;--rose:#B76B78;--gold:#D7B779;--ivory:#FFF8EF;--blush:#F5E5E0;--dusty:#D9A7A8;--beige:#D9C4A4;--ink:#482033;--serif:'Cormorant Garamond',Georgia,serif;--script:'Pinyon Script',cursive;--sans:'DM Sans',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--ivory);overflow-x:hidden;line-height:1.6;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
svg{display:block;max-width:100%}
.label{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--rose)}
.script{font-family:var(--script);color:var(--gold);font-weight:400}
h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.1}
section{position:relative;padding:5.5rem 1.5rem;text-align:center;overflow:hidden}
.wrap{max-width:30rem;margin:0 auto;position:relative;z-index:2}
.rv{opacity:0;transform:translateY(18px);transition:opacity 1.4s ease,transform 1.4s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.dr path,.dr line,.dr circle.o{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.6s ease .2s}
.in .dr path,.in .dr line,.in .dr circle.o,.dr.in path,.dr.in line{stroke-dashoffset:0}
#gate{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 40%,#6a2542 0%,var(--wine) 55%,#3a1226 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6rem;padding:1.5rem;transition:opacity 1.6s ease,visibility 1.6s;color:var(--ivory);animation:fade 1.6s ease both}
#gate.gone{opacity:0;visibility:hidden}
@keyframes fade{from{opacity:0}to{opacity:1}}
#gate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.env{position:relative;width:min(84vw,22rem);aspect-ratio:1.45;perspective:1200px;animation:enter 2.6s cubic-bezier(.2,.7,.2,1) .6s both;cursor:pointer;background:none;border:0;padding:0;color:inherit}
@keyframes enter{from{opacity:0;transform:translateY(60px) scale(.94)}to{opacity:1;transform:none}}
.env .body{position:absolute;inset:0;background:linear-gradient(160deg,#F5E5E0,#E9D3C6);border-radius:4px;box-shadow:0 30px 60px rgba(0,0,0,.45);overflow:hidden}
.env .body svg{position:absolute;inset:0;width:100%;height:100%}
.env .card{position:absolute;left:7%;right:7%;top:8%;bottom:8%;background:var(--ivory);border:1px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 2s cubic-bezier(.6,0,.2,1) .9s;z-index:1;text-align:center;color:var(--wine)}
.env .card b{font-family:var(--script);font-weight:400;font-size:2.4rem;color:var(--wine)}
.env .card span{font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--rose)}
.env .flap{position:absolute;left:0;right:0;top:0;height:56%;transform-origin:top;transition:transform 1.3s cubic-bezier(.6,0,.2,1);z-index:3;transform-style:preserve-3d}
.env .flap svg{width:100%;height:100%}
.env .seal{position:absolute;left:50%;top:50%;width:21%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:4;animation:seal 1.6s ease 2.4s both;transition:opacity 1s,transform 1s}
@keyframes seal{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.env.open .seal{opacity:0;transform:translate(-50%,-50%) scale(1.5)}
.env.open .flap{transform:rotateX(180deg)}
.env.open .card{transform:translateY(-62%) scale(1.08)}
#gate .msg{font-family:var(--serif);font-style:italic;font-size:1.5rem;color:var(--gold);animation:fade 2s ease 3s both;text-align:center}
.btn{font-family:var(--sans);font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ivory);background:transparent;border:1px solid var(--gold);padding:1rem 2rem;min-height:3rem;cursor:pointer;position:relative;overflow:hidden;transition:color .6s,background .6s;text-decoration:none;display:inline-block}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--plum);outline:none}
#gate .btn{animation:fade 2s ease 3.6s both}
.btn.dk{color:var(--wine);border-color:var(--rose)}
.btn.dk:hover,.btn.dk:focus-visible{background:var(--wine);color:var(--ivory);border-color:var(--wine)}
#hero{background:radial-gradient(ellipse at 50% 38%,#7a2c4c 0%,rgba(84,28,53,0) 62%),linear-gradient(180deg,var(--wine) 0%,var(--plum) 70%,#5a2540 100%);color:var(--ivory);min-height:100svh;display:flex;align-items:center;justify-content:center;padding-top:3rem;padding-bottom:6rem}
.stage{position:relative;width:min(94vw,26rem);margin:0 auto 1.2rem}.stage .art{position:relative;width:100%;filter:drop-shadow(0 18px 28px rgba(0,0,0,.4))}.stage::before{content:"";position:absolute;left:50%;top:46%;width:96%;aspect-ratio:1;translate:-50% -50%;border-radius:50%;background:radial-gradient(circle,rgba(215,183,121,.4),rgba(215,183,121,.08) 55%,transparent 70%);animation:breathe 7s ease-in-out infinite}.halo{position:absolute;left:50%;top:44%;width:116%;aspect-ratio:1;translate:-50% -50%;opacity:.6;animation:spin 150s linear infinite}@keyframes breathe{50%{opacity:.55;transform:scale(1.06)}}@keyframes shine{from{background-position:120% 0}to{background-position:-20% 0}}
#hero h1{font-size:clamp(2.8rem,14vw,4.8rem);letter-spacing:.03em;background:linear-gradient(100deg,#FFF8EF 20%,#E6CB92 45%,#FFF8EF 62%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 8s ease-in-out infinite alternate}
#hero .amp{font-family:var(--script);color:var(--gold);font-size:2.2rem;margin:.1rem 0}
#hero p.inv{font-family:var(--serif);font-style:italic;font-size:1.2rem;color:var(--blush);max-width:20rem;margin:1.4rem auto 0}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.petal{position:absolute;top:-30px;width:11px;height:15px;border-radius:70% 0 70% 0;background:var(--dusty);opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(540deg)}}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:70px;z-index:3}
#story{background:linear-gradient(180deg,var(--ivory),var(--blush))}
#story h2{font-size:clamp(2.2rem,10vw,3.4rem);color:var(--wine);margin:.8rem 0}
#story p{font-family:var(--serif);font-size:1.2rem;line-height:1.7;margin:1.4rem auto;max-width:24rem}
.flora{position:absolute;width:11rem;opacity:.9}
.flora.l{left:-3rem;top:1rem}.flora.r{right:-3rem;bottom:1rem;transform:scaleX(-1) rotate(10deg)}
.sep{width:12rem;margin:1rem auto}
#events{background:linear-gradient(180deg,var(--blush),var(--ivory) 40%,var(--blush));padding-bottom:3rem}
#events h2{font-size:clamp(2.2rem,10vw,3.2rem);color:var(--wine);margin:.8rem 0 3rem}
.ev{margin:0 auto 4rem;max-width:20rem;position:relative}
.ev:nth-of-type(even){transform-origin:center}
.ev .ill{width:11rem;height:11rem;margin:0 auto 1rem;border-radius:50% 50% 0 0/60% 60% 0 0;background:radial-gradient(circle at 50% 100%,rgba(215,183,121,.28),transparent 70%);border-bottom:1px solid var(--gold)}
.ev .ill svg{width:100%;height:100%}
.ev h3{font-size:2rem;color:var(--wine)}
.ev .when{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--rose);margin:.5rem 0 .8rem}
.ev p{font-family:var(--serif);font-size:1.1rem;color:var(--plum)}
#day{background:var(--plum);color:var(--ivory)}
#day h2{font-size:clamp(2.2rem,10vw,3.2rem);margin:.8rem 0 3rem}
.tl{position:relative;text-align:left;padding-left:3.4rem}
.tl::before{content:"";position:absolute;left:1rem;top:.4rem;bottom:.4rem;width:1px;background:linear-gradient(var(--gold),rgba(215,183,121,.2))}
.tl .pt{position:relative;margin-bottom:2.6rem}
.tl .pt svg{position:absolute;left:-3.4rem;top:-.1rem;width:2rem;height:2rem}
.tl .t{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.tl h3{font-size:1.7rem;margin:.2rem 0}
.tl p{font-family:var(--serif);font-size:1.08rem;color:var(--blush)}
#venue{background:linear-gradient(180deg,var(--plum),var(--wine) 45%,#6b2a47);color:var(--ivory);padding-bottom:7rem}
#venue .art{width:min(92vw,26rem);margin:0 auto 1.5rem}
#venue h2{font-size:clamp(2.2rem,10vw,3.2rem);margin:.8rem 0 1rem}
#venue address{font-style:normal;font-family:var(--serif);font-size:1.2rem;color:var(--blush);margin-bottom:.8rem}
#venue .when{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:2rem}
#final{background:linear-gradient(180deg,#6b2a47,#2a0f1e 70%);color:var(--ivory);min-height:100svh;display:flex;align-items:center;justify-content:center}
#final .art{width:min(80vw,18rem);margin:0 auto 1.5rem}
#final h2{font-family:var(--serif);font-style:italic;font-size:clamp(1.8rem,8vw,2.6rem);margin-bottom:1rem}
#final p{font-family:var(--serif);font-size:1.25rem;color:var(--blush)}
#final .sign{margin:2.2rem 0 2.4rem;font-family:var(--serif);font-size:1.15rem}
#final .sign b{display:block;font-family:var(--script);font-weight:400;font-size:2.1rem;color:var(--gold);margin-top:.2rem}
#music{position:fixed;right:max(1rem,env(safe-area-inset-right,0px));bottom:max(1rem,env(safe-area-inset-bottom,0px));width:3rem;height:3rem;border-radius:50%;border:1px solid var(--gold);background:rgba(72,32,51,.82);backdrop-filter:blur(6px);color:var(--gold);cursor:pointer;z-index:40;display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity 1s}
#music.show{opacity:1;visibility:visible}
#music svg{width:1.3rem;height:1.3rem;animation:spin 9s linear infinite;animation-play-state:paused}
#music.on svg{animation-play-state:running}
#music:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:760px){section{padding:7rem 2rem}.wrap{max-width:38rem}.flora{width:16rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}.rv{opacity:1;transform:none}.dr path,.dr line{stroke-dashoffset:0}.petals{display:none}html{scroll-behavior:auto}}
</style>
</head>

const V=CONFIG.venue;
$('#app').innerHTML=`

${CONFIG.story.map(s=>`<p class="rv">${s}</p>`).join('')}</div></section>

<section id="day"><div class="wrap"><div class="label rv" style="color:var(--gold)">The wedding day</div><h2 class="rv">From baraat to blessings</h2><div class="tl">${D}</div></div></section>

function petals(id,n){const c=$(id);if(!c||reduce)return;for(let i=0;i<n;i++){const p=document.createElement('i');p.className='petal';p.style.cssText=`left:${Math.random()*100}%;animation-duration:${14+Math.random()*14}s;animation-delay:${-Math.random()*20}s;--dx:${(Math.random()-.5)*160}px;opacity:${.25+Math.random()*.4};transform:scale(${.6+Math.random()*.8})`;c.appendChild(p)}}
petals('#petals',12);petals('#petals2',10);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.rv,.dr').forEach((el,i)=>{el.style.transitionDelay=el.closest('#hero')?`${(i%7)*.18}s`:'0s';io.observe(el)});
const fl=document.querySelectorAll('.flora');
let tk=false;
addEventListener('scroll',()=>{if(tk||reduce)return;tk=true;requestAnimationFrame(()=>{const y=scrollY;fl.forEach((f,i)=>{const r=f.parentElement.getBoundingClientRect();f.style.translate=`0 ${(r.top*-.08*(i?-1:1)).toFixed(1)}px`});tk=false})},{passive:true});
const cv=$('#dust'),cx=cv.getContext('2d');let pts=[],raf;
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
size();addEventListener('resize',size);
for(let i=0;i<46;i++)pts.push({x:Math.random(),y:Math.random(),r:Math.random()*1.8+.4,s:Math.random()*.00014+.00004,a:Math.random()*Math.PI*2});
function dust(){cx.clearRect(0,0,cv.width,cv.height);pts.forEach(p=>{p.y-=p.s;p.a+=.01;if(p.y<-.02){p.y=1.02;p.x=Math.random()}const x=(p.x+Math.sin(p.a)*.01)*cv.width,y=p.y*cv.height;cx.beginPath();cx.arc(x,y,p.r*devicePixelRatio,0,7);cx.fillStyle=`rgba(215,183,121,${.35+Math.sin(p.a*2)*.25})`;cx.fill()});raf=requestAnimationFrame(dust)}
if(!reduce)dust();
const song=$('#song'),mb=$('#music');
function setMusic(on){mb.classList.toggle('on',on);mb.setAttribute('aria-pressed',on);mb.setAttribute('aria-label',on?'Pause music':'Play music')}
mb.addEventListener('click',()=>{if(song.paused){song.play().then(()=>setMusic(true)).catch(()=>setMusic(false))}else{song.pause();setMusic(false)}});
song.addEventListener('error',()=>setMusic(false));
let opened=false;
function open(){if(opened)return;opened=true;const env=$('#env');env.classList.add('open');song.play().then(()=>setMusic(true)).catch(()=>setMusic(false));
setTimeout(()=>{$('#gate').classList.add('gone');document.body.classList.remove('lock');mb.classList.add('show');cancelAnimationFrame(raf);scrollTo(0,0)},reduce?200:3400)}
$('#env').addEventListener('click',open);$('#openBtn').addEventListener('click',open);
$('#top').addEventListener('click',()=>scrollTo({top:0,behavior:reduce?'auto':'smooth'}));
